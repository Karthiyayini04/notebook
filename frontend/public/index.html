<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Notebook</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Lora:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/quill/1.3.7/quill.snow.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ── AUTH PAGE ─────────────────────────────────────────────────────────── -->
<div class="auth-page" id="authPage">
  <div class="auth-card">
    <div class="auth-logo">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      <span>Notebook</span>
    </div>

    <div class="auth-tabs">
      <button class="auth-tab active" id="loginTab">Sign in</button>
      <button class="auth-tab" id="registerTab">Create account</button>
    </div>

    <!-- Login form -->
    <form id="loginForm" class="auth-form">
      <div class="field">
        <label>Username</label>
        <input type="text" id="loginUsername" placeholder="your_username" autocomplete="username" required/>
      </div>
      <div class="field">
        <label>Password</label>
        <div class="pw-wrap">
          <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password" required/>
          <button type="button" class="pw-toggle" data-target="loginPassword">
            <svg class="eye" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <div class="auth-error hidden" id="loginError"></div>
      <button type="submit" class="btn-primary full" id="loginBtn">Sign in</button>
    </form>

    <!-- Register form -->
    <form id="registerForm" class="auth-form hidden">
      <div class="field">
        <label>Username <span class="hint">(letters, numbers, underscore)</span></label>
        <input type="text" id="regUsername" placeholder="your_username" autocomplete="username" required minlength="3" maxlength="30"/>
        <div class="field-hint" id="usernameHint"></div>
      </div>
      <div class="field">
        <label>Password <span class="hint">(min 6 characters)</span></label>
        <div class="pw-wrap">
          <input type="password" id="regPassword" placeholder="••••••••" autocomplete="new-password" required minlength="6"/>
          <button type="button" class="pw-toggle" data-target="regPassword">
            <svg class="eye" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <div class="field">
        <label>Confirm password</label>
        <div class="pw-wrap">
          <input type="password" id="regConfirm" placeholder="••••••••" autocomplete="new-password" required/>
          <button type="button" class="pw-toggle" data-target="regConfirm">
            <svg class="eye" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <div class="auth-error hidden" id="registerError"></div>
      <button type="submit" class="btn-primary full" id="registerBtn">Create account</button>
    </form>
  </div>
</div>

<!-- ── APP PAGE ──────────────────────────────────────────────────────────── -->
<div class="app-page hidden" id="appPage">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <span class="app-logo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        Notebook
      </span>
      <div class="header-right">
        <button class="icon-btn" id="themeToggle" title="Toggle dark mode">
          <svg class="sun-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          <svg class="moon-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <div class="user-menu-wrap">
          <button class="user-chip" id="userMenuBtn">
            <span class="user-avatar" id="userAvatar"></span>
            <span id="userDisplay"></span>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div class="user-dropdown hidden" id="userDropdown">
            <button class="dropdown-item danger" id="logoutBtn">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
              Sign out
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="search-wrap">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="searchInput" placeholder="Search notes…" autocomplete="off"/>
    </div>

    <div class="tags-section">
      <div class="section-label">Tags</div>
      <div id="tagsList" class="tags-list">
        <button class="tag-filter active" data-tag="all">All notes</button>
      </div>
    </div>

    <div class="notes-section">
      <div class="section-label-row">
        <span class="section-label">Notes</span>
        <button class="new-note-btn" id="newNoteBtn">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          New
        </button>
      </div>
      <div id="notesList" class="notes-list">
        <div class="empty-list">Loading…</div>
      </div>
    </div>
  </aside>

  <!-- Editor -->
  <main class="editor-area">
    <div class="editor-placeholder" id="editorPlaceholder">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      <p>Select a note or create a new one</p>
      <button class="btn-primary" id="placeholderNewBtn">New note</button>
    </div>

    <div class="editor-container hidden" id="editorContainer">
      <div class="editor-topbar">
        <div class="editor-meta">
          <input type="text" id="noteTitle" class="note-title-input" placeholder="Untitled note"/>
          <div class="note-tags-row">
            <div id="activeTagsDisplay" class="active-tags"></div>
            <button class="tag-add-btn" id="tagAddBtn">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              Add tag
            </button>
          </div>
        </div>
        <div class="editor-actions">
          <span class="save-status" id="saveStatus"></span>
          <button class="icon-btn danger" id="deleteNoteBtn" title="Delete note">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
          </button>
        </div>
      </div>
      <div id="quillEditor"></div>
    </div>
  </main>
</div>

<!-- Tag Modal -->
<div class="modal-overlay hidden" id="tagModal">
  <div class="modal">
    <div class="modal-header">
      <span>Manage tags</span>
      <button class="icon-btn" id="closeTagModal">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="tag-input-row">
        <input type="text" id="newTagInput" placeholder="New tag name…" maxlength="30"/>
        <button class="btn-primary small" id="addTagBtn">Add</button>
      </div>
      <div id="modalTagsList" class="modal-tags-list"></div>
    </div>
  </div>
</div>

<!-- Delete Modal -->
<div class="modal-overlay hidden" id="deleteModal">
  <div class="modal small">
    <div class="modal-header"><span>Delete note?</span></div>
    <div class="modal-body">
      <p class="modal-text">This cannot be undone.</p>
      <div class="modal-actions">
        <button class="btn-secondary" id="cancelDelete">Cancel</button>
        <button class="btn-danger" id="confirmDelete">Delete</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/quill/1.3.7/quill.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<link rel="stylesheet" href="ai-styles.css">
<script src="ai.js"></script>
</body>
</html>
