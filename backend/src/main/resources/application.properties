server.port=${SERVER_PORT:8080}

# JWT Secret - reads from environment variable on Render
jwt.secret=${JWT_SECRET:defaultlocalkey}
jwt.expiration=86400000

# CORS - update YOUR_PROJECT_ID after Firebase deploy
cors.allowed-origins=http://localhost:3000,https://YOUR_PROJECT_ID.web.app

# Firebase - reads from environment variable on Render
firebase.credentials.path=firebase-service-account.json